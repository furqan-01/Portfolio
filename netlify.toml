[build]
  publish = "."
  functions = "netlify/functions"

# === YEH BLOCK ADD KIYA HAI ===
# Yeh Netlify ko batayega ke functions ke sath data folder bhi server par bhejna hai
[functions]
  included_files = ["data/**"]
# ==============================

# API routes routed to Netlify Serverless Node.js function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Direct access to the secret Admin panel
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# Main portfolio SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and asset caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
